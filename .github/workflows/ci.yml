name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx tsup
      - if: matrix.node-version == 22
        run: npm run typecheck --workspaces && npm run test --workspaces && npm run build --workspaces
      - if: matrix.node-version == 22
        run: npm run test:artifact --workspace thesidedoor-core
      - if: matrix.node-version == 22
        run: npm run test:package-install
      - if: matrix.node-version == 22
        run: npm run test:release
      - run: npm pack --dry-run
      # Fail only on advisories in shipped (production) dependencies. The dev
      # toolchain's transitive advisories never reach consumers.
      - run: npm audit --omit=dev --audit-level=high
