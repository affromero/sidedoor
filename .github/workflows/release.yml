name: Release

# A v* tag releases the exact package archives verified below.
# NPM_TOKEN must authorize all three packages. No token is available to verification.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sidedoor-npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm ls --workspaces --package-lock-only
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:package-install -- --retain-artifacts "$RUNNER_TEMP/release-packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages
      - run: node scripts/publish-packages.mjs "$RUNNER_TEMP/release-packages" "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node scripts/verify-public-install.mjs "$RUNNER_TEMP/release-packages"
